<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SariSync Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <span class="close" id="close-login">&times;</span>
            <div class="login-form">
                <h2>Welcome to SariSync</h2>
                <p>Sign in to your account</p>
                <form id="login-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button type="submit" class="login-btn">Sign In</button>
                </form>
                <div class="login-footer">
                    <p>Don't have an account? <a href="#" id="show-register">Register</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="register-modal" class="modal">
        <div class="modal-content">
            <span class="close" id="close-register">&times;</span>
            <div class="login-form">
                <h2>Create Account</h2>
                <p>Join Sarisari Store today</p>
                <form id="register-form">
                    <div class="form-group">
                        <label for="reg-username">Username</label>
                        <input type="text" id="reg-username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" name="password" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-confirm-password">Confirm Password</label>
                        <input type="password" id="reg-confirm-password" name="confirm-password" required>
                    </div>
                    <button type="submit" class="login-btn">Create Account</button>
                </form>
                <div class="login-footer">
                    <p>Already have an account? <a href="#" id="show-login">Sign In</a></p>
                </div>
            </div>
        </div>
    </div>

    <header>
        <div class="container">
            <h1 class="logo">Sarisari</h1>
            <nav>
                <div class="category-search">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="category-search" placeholder="Search products...">
                    </div>
                </div>
                <div class="nav-links-container">
                    <div class="nav-links">
                        <a href="#" class="nav-link active" data-category="all">All</a>
                        <!-- Categories will be dynamically added here -->
                    </div>
                    <select class="category-dropdown" style="display: none;">
                        <option value="all">All Categories</option>
                        <!-- Categories will be dynamically added here -->
                    </select>
                </div>
            </nav>
            <div class="header-actions">
                <div class="user-section">
                    <button id="login-btn" class="login-button">Sign In</button>
                    <div id="user-menu" class="user-menu hidden">
                        <span id="user-greeting">Hello, User!</span>
                        <button id="logout-btn" class="logout-button">Logout</button>
                    </div>
                </div>
                <div class="cart-icon">
                    <span id="cart-count">0</span>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 3H5L5.4 5M7 13H17L21 5H5.4M7 13L5.4 5M7 13L4.7 15.3C4.3 15.7 4.6 16.4 5.2 16.4H17M17 17C16.4 17 16 17.4 16 18C16 18.6 16.4 19 17 19C17.6 19 18 18.6 18 18C18 17.4 17.6 17 17 17ZM9 18C9 18.6 8.6 19 8 19C7.4 19 7 18.6 7 18C7 17.4 7.4 17 8 17C8.6 17 9 17.4 9 18Z" 
                              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h2>Daily Essentials</h2>
            <p>Simple shopping for everyday needs</p>
        </section>

        <section class="products-section">
            <div class="products-grid" id="products-container">
                <div class="loading">Loading products...</div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>SariSync &copy; 2025</p>
        </div>
    </footer>

    <div id="product-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modal-product-details"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
